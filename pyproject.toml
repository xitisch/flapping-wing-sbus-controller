[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flapping-wing-sbus-controller"
version = "0.1.0"
description = "PC control and telemetry tools for the flapping-wing SBUS link"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pyserial>=3.5,<4",
]

[project.scripts]
flapping-wing-log = "host.log_telemetry:main"

[project.gui-scripts]
flapping-wing-gui = "host.gui:main"
flapping-wing-wired-test = "diagnostics.wired_c3.gui:main"

[tool.setuptools.packages.find]
include = [
  "host",
  "host.pc_tools",
  "diagnostics",
  "diagnostics.wired_c3",
]
